exclude: ^.venv/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: ["--fix", "--ignore=E402"]
      - id: ruff-format
        exclude: ^src/pipelines/

  # pydoclint runs in an environment of its own rather than in the project's:
  # it needs docstring_parser_fork, and fastmcp (the mcp extra) pulls in the
  # upstream docstring-parser, which ships the same module directory and
  # breaks pydoclint's imports when both are installed together.
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.6.11
    hooks:
      - id: pydoclint
        args: ["--style=google", "--check-return-types=True"]
        exclude: ^src/pipelines/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy warprec
        language: system
        types: [python]
        pass_filenames: false
        # A whole-package check, and it needs the project's dependencies, so it
        # runs before the push rather than on every commit or in CI.
        stages: [pre-push]
        args: [--no-strict-optional, --ignore-missing-imports]
        exclude: ^tests/|^docs/
  # Its own environment, so linting needs neither Poetry nor the project.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["--skip", "B614"]
        exclude: ^tests/|^src/pipelines/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # general file rules
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      # file format checks
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      # git related
      - id: check-added-large-files
        args: ["--maxkb=3000"]
      - id: check-merge-conflict
      # python specifics
      - id: name-tests-test
        args: ["--pytest-test-first"]
