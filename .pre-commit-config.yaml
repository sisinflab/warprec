exclude: ^.venv/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: ["--fix", "--ignore=E402"]
      - id: ruff-format
        exclude: ^src/pipelines/

  # pydoclint runs in an environment of its own rather than in the project's:
  # it needs docstring_parser_fork, and fastmcp (the mcp extra) pulls in the
  # upstream docstring-parser, which ships the same module directory and
  # breaks pydoclint's imports when both are installed together.
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.6.11
    hooks:
      - id: pydoclint
        args: ["--style=google", "--check-return-types=True"]
        exclude: ^src/pipelines/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy warprec
        language: system
        types: [python]
        pass_filenames: false
        # Whole-package checks: too slow to pay on every commit, and pylint's
        # duplicate-code rule needs the whole package anyway, so scoping it to
        # the changed files would silently drop it. Run before the push instead.
        stages: [pre-push]
        args: [--no-strict-optional, --ignore-missing-imports]
        exclude: ^tests/|^docs/

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: poetry run pylint warprec
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
        args:
          [
            "--jobs=0",
            "--fail-under=9",
            "--fail-on=F,E",
            "--max-line-length=120",
            "--reports=no",
            # "--good-names=e,f,i,j,k,p,v,x,y,z,x0,x1,z0,z1,tn,fn,tp,fp,auc,fc,bn",
            # "--disable=C0301, C0114, C0115, C0116, E1101, E1121, R0903, R0913, W0511",
            # R0901: PyTorch/Lightning ancestry is several classes deep by design.
            # W0613: metric and recommender APIs are interface-driven, so an
            # implementation legitimately ignores arguments its siblings use.
            "--disable=C0103,C0114,W0221,W0511,W1113,R0901,W0613,E1101",
            # Argument and attribute counts are enforced, at thresholds this
            # codebase can hold. The few data-schema constructors that exceed them
            # carry a reviewed, in-place exemption.
            "--max-args=10",
            "--max-positional-arguments=10",
            "--max-attributes=15",
            # R0914 is back on. A local variable per intermediate tensor is how
            # the model code reads, so the threshold is high enough that it only
            # catches genuine sprawl; the five functions above it carry a
            # reviewed, in-place exemption.
            "--max-locals=40",
            "--extension-pkg-whitelist=pydantic",
            # Optional dependencies, so that linting never requires them to
            # be installed: PyTorch Geometric and the serving stack (fastapi,
            # fastmcp and their transitive starlette/uvicorn) come from extras.
            # Attribute checks on these modules are off anyway (E1101).
            "--ignored-modules=torch_geometric,fastapi,fastmcp,starlette,uvicorn",
          ]
        exclude: ^tests/|^docs/


  - repo: local
    hooks:
      - id: bandit
        name: bandit
        entry: poetry run bandit --skip B614
        language: system
        types: [python]
        exclude: ^tests/|^src/pipelines/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # general file rules
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      # file format checks
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      # git related
      - id: check-added-large-files
        args: ["--maxkb=3000"]
      - id: check-merge-conflict
      # python specifics
      - id: name-tests-test
        args: ["--pytest-test-first"]
