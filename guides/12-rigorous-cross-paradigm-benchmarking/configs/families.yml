# One iterative model per family, trained on complete.yml's split: the reader,
# splitter and evaluation below are that file's, so the models are compared on
# the same data under the same protocol as Pop, ItemKNN and EASE.
reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  local_path: ../data/ml-100k/ratings.tsv
  rating_type: implicit
splitter:
  test_splitting:
    strategy: temporal_holdout
    ratio: 0.2
models:
  BPR:                 # latent factors, pairwise loss
    embedding_size: 64
    reg_weight: 0.0001
    batch_size: 2048
    epochs: 8
    learning_rate: 0.005
    neg_samples: 4
  LightGCN:            # graph propagation
    embedding_size: 64
    n_layers: 2
    reg_weight: 0.0001
    batch_size: 2048
    epochs: 5
    learning_rate: 0.005
  MultiVAE:            # variational autoencoder over each user's items
    intermediate_dim: 600
    latent_dim: 200
    corruption: 0.5
    anneal_cap: 0.2
    anneal_step: 2000
    weight_decay: 0.0
    batch_size: 256
    epochs: 30
    learning_rate: 0.001
  SASRec:              # self-attention over each user's sequence
    embedding_size: 32
    n_layers: 1
    n_heads: 1
    inner_size: 64
    dropout_prob: 0.2
    attn_dropout_prob: 0.2
    reg_weight: 0.0
    weight_decay: 0.0
    batch_size: 1024
    epochs: 5
    learning_rate: 0.002
    neg_samples: 1
    max_seq_len: 20
evaluation:
  top_k: [10, 20]
  metrics: [nDCG, Recall, HitRate, ItemCoverage]
