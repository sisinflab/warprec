# The keys that decide what the training and evaluation loaders yield.
reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  local_path: ../data/ml-100k/ratings.tsv
  rating_type: implicit
splitter:
  test_splitting:
    strategy: temporal_holdout
    ratio: 0.1
# How training negatives are drawn, for every model that samples them.
training:
  negative_sampling: popularity
  neg_alpha: 0.75
# The batch size of a training loader is a hyperparameter of each model.
models:
  BPR:
    embedding_size: 64
    reg_weight: 0.001
    batch_size: 2048
    epochs: 1
    learning_rate: 0.001
  SASRec:
    embedding_size: 64
    n_layers: 2
    n_heads: 2
    inner_size: 128
    dropout_prob: 0.2
    attn_dropout_prob: 0.2
    reg_weight: 0.0
    weight_decay: 0.0
    batch_size: 512
    epochs: 1
    learning_rate: 0.001
    neg_samples: 1
    max_seq_len: 50
# The evaluation loaders: their batch size and, for 'sampled', the candidates.
evaluation:
  top_k: [10]
  metrics: [nDCG]
  batch_size: 256
  strategy: sampled
  num_negatives: 99
  negative_sampling: uniform
