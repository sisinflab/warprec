# EASE again, this time recommending through an MMR re-ranker that reads each
# film's genres. The run evaluates the re-ranked lists on each user's last
# interaction, writes them (meta.save_recs) and saves the model with what
# serving needs (meta.save_model), item genres included.
reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  local_path: ../data/ml-100k/ratings.tsv
  rating_type: implicit
  side:
    local_path: ../runs/17-serving/item-genres.tsv
splitter:
  test_splitting:
    strategy: temporal_leave_k_out
    k: 1
writer:
  dataset_name: ml-100k-mmr
  writing_method: local
  local_experiment_path: ../runs/17-serving/
  save_split: true         # the test set, to check the reported metric against
  recommendation:
    k: 10
models:
  EASE:
    meta: {save_model: true, save_recs: true}
    l2: 200.0
rerank:
  name: MMR
  pool: 50
  params:
    diversity: 0.3
evaluation:
  top_k: [10]
  metrics: [nDCG, HitRate]
general:
  device: cpu
  ray_address: local
  ray_verbose: 0
