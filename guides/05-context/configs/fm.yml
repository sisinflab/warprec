# A factorization machine over the user, the item and all four contextual fields.
reader:
  loading_strategy: dataset
  data_type: transaction
  reading_method: local
  local_path: ../runs/05-context/ratings-context.tsv
  rating_type: implicit
  labels:
    context_labels: [daypart, weekend, tenure, previous_genres]
  dtypes:
    context_types:
      daypart: str
      weekend: str
      tenure: float32
      previous_genres: str
    context_separators:
      previous_genres: "|"
splitter:
  test_splitting:
    strategy: temporal_leave_k_out
    k: 1
training:
  sequence_pooling: mean
models:
  FM:
    embedding_size: 32
    reg_weight: 0.0001
    batch_size: 2048
    epochs: 3
    learning_rate: 0.001
    neg_samples: 1
    optimization:
      device: cpu
      num_workers: 0
evaluation:
  top_k: [10]
  metrics: [nDCG, HitRate]
  # MovieLens never repeats a (user, item) pair, so exclude every seen item.
  mask_seen: pair
general:
  device: cpu
