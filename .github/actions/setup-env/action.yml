name: 'Setup Python and Poetry'
description: 'Installs Python, Poetry and dependencies'
inputs:
  python-version:
    description: 'Python version'
    required: true
    default: '3.12'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache Poetry venv
      uses: actions/cache@v4
      with:
        path: .venv
        # The action file is part of the key so that changing which extras are
        # installed rebuilds the environment instead of reusing a cached one
        # that still contains the old set.
        key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}-${{ hashFiles('pyproject.toml') }}-${{ hashFiles('.github/actions/setup-env/action.yml') }}

    # mypy re-analyses the whole dependency graph without this, which costs
    # about a minute per run. mypy invalidates its own cache, so reusing it
    # across runs is safe.
    - name: Cache mypy
      uses: actions/cache@v4
      with:
        path: .mypy_cache
        key: mypy-${{ runner.os }}-${{ hashFiles('poetry.lock') }}-${{ github.sha }}
        restore-keys: |
          mypy-${{ runner.os }}-${{ hashFiles('poetry.lock') }}-
          mypy-${{ runner.os }}-

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
        version: 2.1.2

    # Fails in half a second with a clear message when pyproject.toml has
    # changed without `poetry lock` being re-run, instead of surfacing the same
    # problem minutes later from inside the install step.
    - name: Verify lock file matches pyproject.toml
      shell: bash
      run: poetry check --lock

    # Every extra, so that the serving application and its MCP endpoint are
    # tested. pydoclint runs from pre-commit in an environment of its own, so
    # fastmcp's docstring-parser no longer collides with its fork.
    #
    # The install is retried because it fails for reasons that have nothing to
    # do with the project: PyPI's index intermittently reports no candidates for
    # a package that is plainly published, and a cold cache -- which is every
    # run on a branch that has not built before -- fetches over 250 of them, so
    # the chance that one request fails is not small. Poetry does not retry on
    # its own, and a single failed request takes the whole job with it.
    - name: Install dependencies
      shell: bash
      run: |
        install() {
          poetry sync --no-interaction --extras "dashboard remote-io bohb graph serving mcp"
        }
        for attempt in 1 2 3; do
          if install; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            delay=$((attempt * 15))
            echo "::warning::poetry sync failed (attempt ${attempt}/3), retrying in ${delay}s"
            sleep "$delay"
          fi
        done
        echo "::error::poetry sync failed after 3 attempts"
        exit 1
