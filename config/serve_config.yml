# Every key the serving configuration accepts, with its default.
# Start it with: python -m warprec.serve -c config/serve_config.yml
server:
  host: 127.0.0.1          # address the HTTP proxy binds to
  port: 8000               # port the HTTP proxy listens on
  route_prefix: /          # path every route is mounted under
  api_key: null            # X-API-Key value; WARPREC_API_KEY overrides; null disables auth
  mcp: false               # expose the models as MCP tools under /mcp (needs warprec[mcp])
  ray_address: null        # null starts a local Ray; "auto" joins the running cluster

endpoints:                 # at least one; names unique, letters/digits/-/_, not "gateway"
  - name: sasrec
    checkpoint: experiments/ml-1m/serialized/SASRec_example.pth   # written with meta.save_model: true
    device: cpu            # cpu | mps | cuda | cuda:N
    default_k: 10          # items returned when a request does not set k
    max_k: 100             # largest k a request may ask for
    mask_seen: true        # leave out items the user saw in training
    unknown_user: error    # error (404) | popular (most interacted items)
    item_metadata:         # optional: item names for responses and MCP
      path: data/ml-1m/movies.dat
      sep: "::"
      header: false
      id_column: 0         # position, or column name when header is true
      name_column: 1
      encoding: latin-1
    batching:
      max_batch_size: 64
      batch_wait_timeout_s: 0.005
    deployment:            # passed to Ray Serve as-is
      num_replicas: 1      # integer, or "auto"; not together with a fixed autoscaling_config
      max_ongoing_requests: null  # null follows batching.max_batch_size, so batches can fill
      autoscaling_config: null   # e.g. {min_replicas: 1, max_replicas: 8, target_ongoing_requests: 16}
      ray_actor_options: null    # e.g. {num_cpus: 2, num_gpus: 0.25}; cuda defaults num_gpus to 1
