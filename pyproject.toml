[project]
name = "warprec"
description = "Unifying Academic Rigor and Industrial Scale for Responsible, Reproducible, and Efficient Recommendation"
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [
    {name = "MarcoWV", email = "marco.avolio@wideverse.com"},
    {name = "potitoaghilar", email = "potito.aghilar@wideverse.com"},
    {name = "SabeeenoGH", email = "sabino.roccotelli@wideverse.com"},
    {name = "vitowalteranelli", email = "vitowalter.anelli@poliba.it"},
    {name = "JTOVS", email = "joseph.trotta@ovs.it"},
]
# The version stays under tool.poetry, where semantic-release bumps it, and the
# dependencies stay there too, in Poetry's caret syntax.
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
dashboard = [
    "wandb>=0.19.10,<0.20.0",
    "codecarbon>=3.0.0,<4.0.0",
    "mlflow>=2.22.0,<3.0.0",
]
remote-io = [
    "azure-storage-blob>=12.26.0,<13.0.0",
    "azure-identity>=1.25.1,<2.0.0",
]
# Ray Serve, which brings FastAPI and uvicorn with it. Its own extra rather
# than part of the core install: it pulls in a web stack training never uses.
serving = [
    "ray[serve]>=2.58.0,<3.0.0",
]
# The MCP endpoint on top of serving. Kept apart from 'serving' so CI can test
# the server without fastmcp, which cannot share an environment with pydoclint.
mcp = [
    "ray[serve]>=2.58.0,<3.0.0",
    "fastmcp>=3.1.0,<4.0.0",
]
bohb = [
    "hpbandster>=0.7.4,<0.8.0",
    "configspace>=1.2.2,<2.0.0",
]
graph = [
    "torch-geometric>=2.7.0,<3.0.0",
]
all = [
    "wandb>=0.19.10,<0.20.0",
    "codecarbon>=3.0.0,<4.0.0",
    "mlflow>=2.22.0,<3.0.0",
    "azure-storage-blob>=12.26.0,<13.0.0",
    "azure-identity>=1.25.1,<2.0.0",
    "ray[serve]>=2.58.0,<3.0.0",
    "fastmcp>=3.1.0,<4.0.0",
    "hpbandster>=0.7.4,<0.8.0",
    "configspace>=1.2.2,<2.0.0",
    "torch-geometric>=2.7.0,<3.0.0",
]

[project.scripts]
warprec = "warprec.run:main"
"warprec.run" = "warprec.run:main"
"warprec.serve" = "warprec.serve:main"

[tool.poetry]
version = "1.15.2"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2.3"
scipy = "^1.15.1"
numpy = "^2.2.2"
pydantic = "^2.10.6"
tabulate = "^0.9.0"
scikit-learn = "^1.6.1"
hyperopt = "^0.2.7"
ray = {extras = ["data", "train", "tune"], version = "^2.54.0"}
types-pyyaml = "^6.0.12.20241230"
types-tabulate = "^0.9.0.20241207"
loguru = "^0.7.3"
tensorboard = "^2.19.0"
tensorboardx = "^2.6.2.2"
torch = "^2.7.0"
torchmetrics = "^1.8.2"
optuna = "^4.5.0"
polars = "^1.36"
narwhals = "^2.15.0"
lightning = "^2.6.1"
coolname = "^5.0.0"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.1.0"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
ruff = "^0.9.3"
pydoclint = "^0.6.0"
mypy = "^1.14.1"
pylint = "^3.3.3"
bandit = "^1.8.2"
nvitop = "^1.4.2"
matplotlib = "^3.10.3"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.6"
mkdocstrings = {extras = ["python"], version = "^1.0.3"}
mkdocs-llmstxt = "^0.5.0"


[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"


[tool.semantic_release]
version_toml = [
    "pyproject.toml:tool.poetry.version",
]
branch = "main"
changelog_file = "CHANGELOG.md"
upload_to_repository = false
upload_to_release = true
commit_message = "chore(release): {version} [skip ci]"
commit_author = "github-actions [bot] <github-actions[bot]@users.noreply.github.com>"


[tool.coverage.report]
# A floor, not a target, and deliberately well under where the suite actually
# sits (80%). A threshold pressed right up against the real number turns every
# ordinary change into a coverage negotiation, which is how a suite ends up with
# tests written to move a percentage rather than to catch anything. This one is
# here to fail loudly if coverage collapses, and to stay out of the way
# otherwise.
# The gap to 100 is almost entirely warprec/pipelines, which cannot run without
# a Ray cluster; closing it means integration tests, not more unit tests.
fail_under = 70
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.run]
source = ["warprec"]
# These run inside Ray replicas, which test_serving_app exercises over HTTP but
# coverage cannot see. The logic they delegate to is covered in process.
omit = [
    "*/warprec/serving/api.py",
    "*/warprec/serving/deployments.py",
    "*/warprec/serving/mcp.py",
]


[tool.pytest.ini_options]
# conftest.py holds helpers the suites share, so the test directory itself is
# importable rather than relying on a package __init__.
pythonpath = ["tests"]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
